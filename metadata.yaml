name: astrbot_plugin_humanoid_core
display_name: 人形化伴侣核心插件
short_desc: 日程/天气/生理周期/状态/时间/昵称设置
desc: |
  🧠 拟真生活引擎，让人工智能拥有“身体”和“生活感”。

  核心功能：
  • 每日动态日程生成（LLM驱动 + 备用模板）
  • 精力系统：随时间、活动自然变化
  • 生理周期模拟（经期/卵泡期/排卵期/黄体期）
  • 实时天气获取（OpenWeather）
  • 低侵入模式：聊天自然，不刻意报日程
  • AI可感知所在城市（配置 `timezone_city`）

  便捷指令：
  /你的状态 – 查看当前精力、生理、天气、日程
  /时间 城市 – 管理员查询世界城市当前时间（可配置默认城市）
  /叫我 昵称 – 自定义你的称呼
  /查看所有昵称 – 管理员查看全体用户昵称
  /拟人帮助 – 列出所有指令

  轻量、无额外依赖，开箱即用。
version: 2.1.4
author: 娜莉灵
repo: https://github.com/naliling/humanoid_core_plugin
astrbot_version: ">=4.0.0"
support_platforms:
  - aiocqhttp
  - qq_official
tags:
  - 拟真
  - 生活模拟
  - 人格驱动
  - 状态管理
