name: astrbot_plugin_humanoid_core
display_name: 人形化伴侣插件
short_desc: 日程/天气/生理/情绪/时间/星期感知/聊天环境/昵称
desc: |
  拟真生活引擎，让人工智能拥有"身体"和"生活感"。

  核心功能：
  • 生理周期模拟
  • 每日动态日程生成（LLM驱动 + 备用模板）
  • 精力系统：取消惯性、随机波动、午后节律（-2%）、每日保底30
  • 实时天气获取（OpenWeather）
  • 情绪系统：好感度/亲近欲/攻击性三维度，用户交互驱动，精力与周期调制
  • 情绪日志：自动记录情绪关键变化
  • 多人格系统：支持两个人格配置（默认人格 + 切换目标人格），手动或定时自动切换（含自定义时间）
  • 临时切换：可指定持续时间或具体时间点，到期自动恢复默认人格（可全局开关）
  • 三种聊天模式：完整注入/低侵入/纯情绪
  • 环境感知：支持私聊、群聊或全部生效
  • 聊天感知：AI识别当前是群聊还是私聊，语气自动适配
  • 星期几感知：AI知道今天星期几，日程生成和对话更贴合
  • 感知所在城市及当前时间（自定义）
  • 自定义昵称，强制模型按昵称称呼用户
  • 覆盖中日俄主要城市的时间查询（所有用户可用，含星期几）
  • 管理员可一键重置精力和生理周期

  便捷指令：
  /你的状态 – 查看当前精力（含拟人描述）、生理、天气、日程、星期几、情绪标签、当前人格
  /好感度 – 查看情绪档案（好感度/亲近欲/攻击性数值及标签）
  /情绪详情 – 查看详细情绪档案（含基线、轮次）
  /情绪日志 – 查看情绪波动记录
  /重置情绪 – 重置情绪至初始值（管理员）
  /设置好感度 数值 – 手动设置好感度（管理员）
  /批量好感度 QQ:数值,QQ:数值 – 批量导入好感度（管理员）
  /切换人格 名称 – 切换人格（需启用多人格）
  /查看人格 – 查看当前人格和可用人格列表
  /人格详情 [名称] – 查看人格详细设定
  /时间 城市 – 查询世界城市当前时间（含星期几，所有用户可用）
  /叫我 昵称 – 自定义你的称呼
  /查看所有昵称 – 管理员查看全体用户昵称
  /重置状态 – 管理员重置精力和生理周期
  /拟人帮助 – 列出所有指令

  轻量、无额外依赖，开箱即用。
