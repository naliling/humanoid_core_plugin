name: astrbot_plugin_humanoid_core
display_name: 人形化伴侣插件
short_desc: 给她一具身体和一天要过的日子；说什么、怎么说，由她自己定。
desc: |
  人设是一段文字，日子不是。

  她按自己那份人设过一天：熬了夜会欠觉，到点会饿，手上在忙一件事接着一件事，你说过的事她记着。
  这具身体会真的进到她的上下文里（她此刻的困、饿、攒着的火、今天过到这会干了什么），但插件不替她
  写台词、不给她下禁令、不把体检单读数端给她——她说自己困不困、回复多长、夜里要不要接着聊，都是
  她自己判断。不配模型也有身体，配了才有每天新日程。不用配置，不装别的插件也完全能用。
version: 2.16.3
author: 娜莉灵
repo: https://github.com/naliling/humanoid_core_plugin
astrbot_version: ">=4.0.0"
support_platforms:
  - aiocqhttp
  - qq_official
