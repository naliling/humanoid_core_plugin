name: astrbot_plugin_humanoid_core
display_name: 人形化伴侣插件
short_desc: 想要轻量型的拟人化又要齐全？插件内使用轻量生理周期与简单的日程内置的时间感知，设置位置后即可获取当地的时间
desc: |
  这个插件让AI拥有自己的生活节奏：
  - 每天生成不同的日程安排
  - 精力会随活动消耗和恢复（经期更快，卵泡期更慢）
  - 有6阶段生理周期，描述只谈能量水平
  - 情绪三维度（好感度/亲近欲/攻击性）随对话变化
  - 自动记录情绪关键变化
  - 可切换人格，手动或定时
  - 接入实时天气，影响日常氛围
  - 知道今天是星期几，知道所在城市的当前时间
  - 支持自定义昵称
  - 支持中日俄主要城市时间查询
  - 新增心情标签、社交能量、夜间睡眠模式
  - 情绪更新可靠性提升（本地规则兜底）
  - 插件生命周期优雅管理
  - 新增热重载配置（/重载配置 指令）
  - 新增调试模式（详细日志输出）

  指令和配置见 README.md。
version: 2.7.5
author: 娜莉灵
repo: https://github.com/naliling/humanoid_core_plugin
astrbot_version: ">=4.0.0"
support_platforms:
  - aiocqhttp
  - qq_official
tags:
  - 拟真
  - 生理拟人
  - 情绪系统
  - 情绪日志
  - 多人格
  - 自定义时间切换
  - 内置时间
  - 状态写实
  - 位置地区
  - 心情
  - 社交能量
  - 睡眠
