name: astrbot_plugin_humanoid_core
display_name: 人形化伴侣插件
short_desc: 人设是一句话，日子是一整天。
desc: |
  她会困，会饿到敷衍你；你三小时没吭声，她自己会想明白你大概是去忙了。

  她有自己的身体与日子：会累会犯困，睡不够起不来，生理周期按天起伏（8 个阶段，各有自己的体感）；
  一天是可以被打断的——有人来、临时起意，都可能让她放下手上的事。

  人形化不替她写台词，也不给她定字数——自由的身体、日子、注意力是她的，嘴也是。

  她回复时会像真人一样显示「正在输入」（仅 NapCat 私聊）。装了「自主拟人社交」时，
  她会把身体、日程、关系导出给它，由它决定什么时候主动开口——这些都不改她说话的方式。

  她不做长期记忆：不建记忆库、不存聊天记录。她只留两样短东西——最近 12 小时内你说过的一句
  原话，和手上还开着的未完事项（对方提了没下文的、她答应过还没兑现的，最多三条、最多放三天）。
  两样都是随每条回复一起递给她的一句事实，不落会话历史，所以上下文被压缩掉也不影响。
  长期记忆不归她管：装了「我会牢牢记住你」时，她会按你这句话去读、也会把自己生活里的事
  写回去；没装也照常跑。

  使用轻量 配置不复杂 需要调的东西就一些 额外的都标上【进阶】。
version: 2.28.4
author: 娜莉灵
repo: https://github.com/naliling/humanoid_core_plugin
astrbot_version: ">=4.0.0"
