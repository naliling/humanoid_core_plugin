name: astrbot_plugin_humanoid_core
display_name: 人形化伴侣插件
short_desc: 人设是一句话，日子是一整天。
desc: |
  她会困，会饿到敷衍你，会记得你上周提过的那只猫；你三小时没吭声，她自己会想明白你大概是去忙了。

  人形化不替她写台词，也不给她定字数——自由的身体、日子、注意力是她的，嘴也是。

  不配模型她也有身体，配上模型每天一份新日程。中/俄/日 9800+ 个地名对得上时区，常用 8 项一条 /拟人设置 就改完，剩下的都标着【进阶】。
