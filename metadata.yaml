name: astrbot_plugin_humanoid_core
display_name: 人形化伴侣核心插件
short_desc: 日程/天气/生理/精力拟人化/环境感知/昵称/重置状态
desc: |
  🧠 拟真生活引擎，让人工智能拥有"身体"和"生活感"。

  核心功能：
  • 每日动态日程生成（LLM驱动 + 备用模板）
  • 精力系统：带惯性、随机波动、午后节律的拟人化变化
  • 生理周期模拟，支持完整/简洁两种描述风格
  • 实时天气获取（OpenWeather）
  • 三种聊天模式：完整注入/低侵入/纯情绪
  • 环境感知：支持私聊、群聊或全部生效
  • AI可感知所在城市及当前时间
  • 自定义昵称，强制模型按昵称称呼用户
  • 覆盖中日俄主要城市的时间查询
  • 管理员可一键重置精力和生理周期

  便捷指令：
  /你的状态 – 查看当前精力（含拟人描述）、生理、天气、日程
  /时间 城市 – 查询世界城市当前时间（所有用户可用）
  /叫我 昵称 – 自定义你的称呼
  /查看所有昵称 – 管理员查看全体用户昵称
  /重置状态 – 管理员重置精力和生理周期
  /拟人帮助 – 列出所有指令

  轻量、无额外依赖，开箱即用。
version: 2.1.9
author: 娜莉灵
repo: https://github.com/naliling/humanoid_core_plugin
astrbot_version: ">=4.0.0"
support_platforms:
  - aiocqhttp
  - qq_official
tags:
  - 拟真
  - 生活模拟
  - 人格驱动
  - 状态管理
