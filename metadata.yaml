name: astrbot_plugin_humanoid_core
display_name: 人形化伴侣插件
short_desc: 轻量拟人插件，内置时间、生理、情绪、过程与自然行为倾向。
desc: |
  想要使用轻量又简单的拟人插件？娜莉灵建议可以来尝尝我的这款——内置时间、生理、情绪、过程、社交能量与天气感知，无需复杂配置，选地区即可让 AI 拥有连续的生活节奏。
  插件同时提供轻量的自然行为系统：AI 会感知对话之间的时间间隔，把“刚刚回来”“隔了一会儿”“隔了几小时”等情况作为短期事件和注意力背景交给模型，再结合精力、社交能量与关系状态形成行为倾向。
  这些信息不会生成固定台词，也不会强制 AI 每次都追问用户，而是作为模型的决策背景，让它自行判断什么时候自然地表达关心、好奇、延续话题或保持安静。
  插件定位仍然是轻量拟人核心，默认值以稳定和自然为优先，不要求额外模型或复杂配置。
version: 2.13.1
author: 娜莉灵
repo: https://github.com/naliling/humanoid_core_plugin
astrbot_version: ">=4.0.0"
support_platforms:
  - aiocqhttp
  - qq_official
tags:
