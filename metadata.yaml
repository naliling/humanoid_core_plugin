name: astrbot_plugin_humanoid_core
display_name: 人形化核心伴侣
short_desc: 人设是一句话，日子是一整天。
desc: |
  让角色拥有从早到晚都在变化的状态，而不只是几轮对话。

  日程驱动睡眠、活动与休息，精力和身体状态随时间起伏；情绪、关系与生活记录会结合互动更新。睡醒、忙碌或状态低落时，注入上下文会反映当下，而不是固定台词。

  可独立使用；与「自主拟人社交」联动后，主动消息能参考角色的身体、日程、情绪和关系背景。长期记忆由单独的记忆插件负责读写。

  群聊也可参与情绪更新，但只对已有档案的人生效，互动间隔更宽。亲密场景模拟默认关闭，可按需单独开启。
version: 3.1.56
author: 娜莉灵
repo: https://github.com/naliling/humanoid_core_plugin
astrbot_version: ">=4.24.0"
support_platforms:
  - aiocqhttp
  - qq_official
